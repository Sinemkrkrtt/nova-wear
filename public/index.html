<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    
    <!-- TARAYICI SEKMESİNDEKİ SİMGE (kırpılıp büyütülmüş logo) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF8F7" />
    
    <meta
      name="description"
      content="Nova Wear — davet, nişan ve özel geceler için zarif elbiseler. Shine like a nova."
    />

    <!-- WHATSAPP, INSTAGRAM VE FACEBOOK'TA PAYLAŞILINCA ÇIKACAK ÖNİZLEME
         Görsel 1200x630: bu ölçü paylaşım kartlarının standardı, kırpılmadan
         basılır.

         Adresler TAM yazılmak zorunda: paylaşım tarayıcıları göreli adresi
         güvenilir biçimde çözmüyor. Kendi alan adını aldığında aşağıdaki
         novawear-sage.vercel.app geçen yerleri (og:image, og:url, canonical,
         twitter:image, ld+json ve sitemap.xml + robots.txt) yeni adresle
         değiştir. -->
    <meta property="og:site_name" content="Nova Wear" />
    <meta property="og:title" content="Nova Wear | Shine like a nova" />
    <meta property="og:description" content="Nova Wear — davet, nişan ve özel geceler için zarif elbiseler. Shine like a nova." />
    <meta property="og:image" content="https://novawear-sage.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nova Wear logosu" />
    <meta property="og:url" content="https://novawear-sage.vercel.app/" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:type" content="website" />

    <!-- X (Twitter): büyük görselli kart -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova Wear | Shine like a nova" />
    <meta name="twitter:description" content="Davet, nişan ve özel geceler için zarif elbiseler." />
    <meta name="twitter:image" content="https://novawear-sage.vercel.app/og-image.jpg" />

    <!-- TELEFON EKRANINA KISAYOL EKLENDİĞİNDE ÇIKACAK SİMGE (kare logo) -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/nova-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>Nova Wear | Shine like a nova</title>

    <link rel="canonical" href="https://novawear-sage.vercel.app/" />

    <!-- GOOGLE İÇİN MARKA BİLGİSİ (ad + logo) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nova Wear",
        "url": "https://novawear-sage.vercel.app/",
        "slogan": "Shine like a nova.",
        "description": "Nova Wear — davet, nişan ve özel geceler için zarif elbiseler.",
        "logo": "https://novawear-sage.vercel.app/nova-icon.png",
        "image": "https://novawear-sage.vercel.app/og-image.jpg"
      }
    </script>
  </head>
  <body>
    <noscript>Nova Wear'i görüntülemek için JavaScript'i etkinleştirmeniz gerekmektedir.</noscript>
    <!-- Google'ın başlık olarak kullanması için marka H1'i (ekranda görünmez, erişilebilir) -->
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
      Nova Wear — Shine like a nova. Abiye, nişanlık ve özel gün elbiseleri
    </h1>
    <div id="root"></div>
  </body>
</html>
