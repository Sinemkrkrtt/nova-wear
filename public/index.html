<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    
    <!-- TARAYICI SEKMESİNDEKİ SİMGE (kırpılıp büyütülmüş logo) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF8F7" />
    
    <meta
      name="description"
      content="Nova Wear — günlük giyimde doğru kumaş, abartısız kesim. Tarzınla parla."
    />

    <!-- WHATSAPP VE INSTAGRAM GİBİ YERLERDE PAYLAŞILINCA ÇIKACAK BİLGİLER -->
    <meta property="og:title" content="Nova Wear | Tarzınla parla" />
    <meta property="og:description" content="Nova Wear — günlük giyimde doğru kumaş, abartısız kesim. Tarzınla parla." />
    <!-- TODO(alan adı): Nova Wear alan adı belli olunca og:image ve og:url
         gerçek adresle doldurulmalı (WhatsApp/Instagram paylaşım görseli). -->
    <meta property="og:type" content="website" />

    <!-- TELEFON EKRANINA KISAYOL EKLENDİĞİNDE ÇIKACAK SİMGE -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>Nova Wear | Tarzınla parla</title>

    <!-- TODO(alan adı): kanonik adres, site yayına alınınca eklenecek. -->

    <!-- GOOGLE İÇİN MARKA BİLGİSİ (ad + logo)
         TODO(alan adı): url / logo / sameAs alanları gerçek adreslerle doldurulmalı. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nova Wear",
        "slogan": "Tarzınla parla.",
        "description": "Nova Wear — günlük giyimde doğru kumaş, abartısız kesim."
      }
    </script>
  </head>
  <body>
    <noscript>Nova Wear'i görüntülemek için JavaScript'i etkinleştirmeniz gerekmektedir.</noscript>
    <!-- Google'ın başlık olarak kullanması için marka H1'i (ekranda görünmez, erişilebilir) -->
    <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
      Nova Wear — Tarzınla parla. Günlük giyim ve yeni sezon koleksiyonu
    </h1>
    <div id="root"></div>
  </body>
</html>
